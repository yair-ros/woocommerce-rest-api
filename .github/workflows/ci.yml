name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (Java 11.0.26)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 11.0.26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11.0.26'

      - name: Run unit tests
        run: mvn --batch-mode --no-transfer-progress --file wc-api-java/pom.xml test
